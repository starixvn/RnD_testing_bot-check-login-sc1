image: 
  name: git3.nexdev.net:5050/rnd/testing/bot-login-sc2

stages: 
  - test
  - after-test
  - cleanup

login-test:
  stage: test
  tags:
   - docker-automation-test
  script:
   - npm install
   - set NODE_ENV=cf_prod
   - npm run test
  artifacts:
    reports:
      dotenv: 
        - Report/Pictures/*.png
    when: always
    expire_in: 1 day  

    

  
  
